[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naruto-daily-adb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "opencv-python-headless>=4.10", "python-dotenv>=1.0", "pydantic>=2.12", "claude-agent-sdk==0.2.152", "pydantic-ai-slim[openai]==2.41.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
login-service = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "qrcode[pil]>=8,<9", "oss2>=2.19,<3", "redis>=5,<8"]
login-service-test = ["pytest>=8", "httpx>=0.28,<1", "fakeredis[lua]>=2,<3"]

[project.scripts]
naruto-daily = "naruto_daily.cli:main"
naruto-login-service = "naruto_daily.login_service.__main__:main"

[tool.setuptools.packages.find]
include = ["naruto_daily*"]

[tool.setuptools.package-data]
"naruto_daily.multimodal.agent" = ["README.md"]
"naruto_daily.login_service" = ["README.md", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
