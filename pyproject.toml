[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naruto-daily-adb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "opencv-python-headless>=4.10", "python-dotenv>=1.0", "pydantic>=2.12", "claude-agent-sdk==0.2.152"]

[project.optional-dependencies]
test = ["pytest>=8", "pydantic-ai-slim[openai]==2.41.0"]

[project.scripts]
naruto-daily = "naruto_daily.cli:main"

[tool.setuptools.packages.find]
include = ["naruto_daily*"]

[tool.setuptools.package-data]
"naruto_daily.multimodal.agent" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
